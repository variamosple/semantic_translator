[tool.ruff]
line-length = 100
target-version = "py313"

exclude = [
    "old_request_handler/**",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
]

ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"